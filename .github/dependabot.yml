version: 2
# No `labels:` — Dependabot's defaults ("dependencies" plus the ecosystem,
# e.g. "github_actions") are created automatically; custom labels must exist first.
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # One PR for all minor/patch bumps; majors get their own PRs so breaking changes are reviewed separately.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
